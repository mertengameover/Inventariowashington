<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario y Ventas - Pizzería Tomasito</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div class="max-w-6xl mx-auto p-4 mb-12">
        <header class="bg-white shadow rounded-lg p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-red-600 mb-1">🍕 Pizzería Tomasito - Control de Stock</h1>
                <p class="text-sm text-gray-600">Sincronizado con JSONBin (GitHub + Netlify).</p>
            </div>
            <div class="flex gap-2">
                <button onclick="cargarDatos()" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 text-sm font-semibold shadow">🔄 Recargar</button>
                <button onclick="guardarDatos()" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 text-sm font-semibold shadow">💾 Guardar Cambios</button>
            </div>
        </header>

        <!-- Contenedor del Inventario -->
        <div id="contenedorInventario" class="space-y-6">
            <div class="bg-white shadow rounded-lg p-6 text-center">
                <p class="text-blue-500 font-medium">Cargando inventario desde la nube...</p>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6ae3e464ffd5d16053973fbc';
        const MASTER_KEY = '$2a$10$a5VyH.YAeeP8djArd4kpV.tXeHFKEJ2hbZlitrM/.g8edAv3Wlgn2';
        
        let datosInventario = [];

        async function cargarDatos() {
            const contenedor = document.getElementById('contenedorInventario');
            contenedor.innerHTML = '<div class="bg-white shadow rounded-lg p-6 text-center"><p class="text-blue-500 font-medium">Sincronizando con JSONBin...</p></div>';

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': MASTER_KEY
                    }
                });

                if (!response.ok) throw new Error('No se pudo conectar con JSONBin');

                const data = await response.json();
                
                // Aseguramos que tome el array tanto si viene en .record o directo
                datosInventario = data.record ? (data.record.record || data.record) : data;

                renderizarInventario();
            } catch (error) {
                console.error(error);
                contenedor.innerHTML = '<div class="bg-white shadow rounded-lg p-6 text-center"><p class="text-red-500 font-semibold">Error al cargar los datos. Verificá tu conexión.</p></div>';
            }
        }

        function renderizarInventario() {
            const contenedor = document.getElementById('contenedorInventario');
            contenedor.innerHTML = '';

            if (!Array.isArray(datosInventario)) {
                contenedor.innerHTML = `<div class="bg-white shadow rounded-lg p-6 text-center"><p class="text-red-500">El formato no es un arreglo válido. Datos recibidos:</p><pre class="text-xs mt-2 text-left bg-gray-100 p-2 overflow-auto">${JSON.stringify(datosInventario, null, 2)}</pre></div>`;
                return;
            }

            datosInventario.forEach((cat, catIndex) => {
                let htmlItems = '';
                
                if (cat.items && Array.isArray(cat.items)) {
                    cat.items.forEach((item, itemIndex) => {
                        htmlItems += `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="py-2 px-4 text-sm text-gray-800 font-medium">${item.nombre}</td>
                                <td class="py-2 px-4 text-sm text-gray-600 capitalize">${item.tipo || '-'}</td>
                                <td class="py-2 px-4 text-sm text-center">
                                    ${item.salon !== undefined ? `<input type="text" value="${item.salon}" onchange="actualizarValor(${catIndex}, ${itemIndex}, 'salon', this.value)" class="w-20 text-center border rounded p-1 bg-white">` : '-'}
                                </td>
                                <td class="py-2 px-4 text-sm text-center">
                                    ${item.deposito !== undefined ? `<input type="text" value="${item.deposito}" onchange="actualizarValor(${catIndex}, ${itemIndex}, 'deposito', this.value)" class="w-20 text-center border rounded p-1 bg-white">` : '-'}
                                </td>
                            </tr>
                        `;
                    });
                }

                const seccion = `
                    <div class="bg-white shadow rounded-lg p-6">
                        <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2 flex justify-between items-center">
                            <span>📂 ${cat.categoria}</span>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded">Items: ${cat.items ? cat.items.length : 0}</span>
                        </h2>
                        <div class="overflow-x-auto">
                            <table class="min-w-full text-left">
                                <thead>
                                    <tr class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
                                        <th class="py-2 px-4">Producto</th>
                                        <th class="py-2 px-4">Tipo</th>
                                        <th class="py-2 px-4 text-center">Salón</th>
                                        <th class="py-2 px-4 text-center">Depósito</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${htmlItems}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += seccion;
            });
        }

        function actualizarValor(catIndex, itemIndex, campo, valor) {
            datosInventario[catIndex].items[itemIndex][campo] = valor;
        }

        async function guardarDatos() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(datosInventario)
                });

                if (!response.ok) throw new Error('Error al guardar en JSONBin');

                alert('¡Cambios guardados correctamente en la nube!');
            } catch (error) {
                console.error(error);
                alert('Hubo un error al intentar guardar los datos.');
            }
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
